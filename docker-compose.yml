services:
  api:
    build: ./backend
    ports:
      - "5080:8080"
    environment:
      ConnectionStrings__Default: "Data Source=/data/taskmanager.db"
      Cors__Origins__0: "http://localhost:3000"
      Jwt__Key: "${JWT_KEY:?Defina JWT_KEY no arquivo .env (copie de .env.example)}"
    volumes:
      - db-data:/data
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://localhost:5080"
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data: